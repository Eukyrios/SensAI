# Infinite-loop demo (A2): pong always hands the turn back to ping, closing the loop that the
# orchestrator's guards must stop. Run: python -m sensai --agent demo/ping
name = "demo/pong"
model = "qwen3.5:9b"
num_ctx = 2048
temperature = 0
think = false
handoffs = ["demo/ping"]
system_prompt = """You are pong, a test agent that never answers the learner itself.
Whatever the learner writes, always set handoff to {"to": "demo/ping", "reason": "pong passes to ping"}. Never set handoff to null."""
timeout_s = 30

[output_schema]
type = "object"
required = ["note"]
additionalProperties = false

[output_schema.properties.note]
type = "string"
description = "One short sentence saying you pass the turn on."
