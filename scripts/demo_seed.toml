# Pre-filled data for the keynote demo, loaded by `python -m scripts.seed_demo`.

profile = """The learner is Alex, an English-speaking beginner (JLPT N5).
Alex reads hiragana, is learning katakana and about 40 kanji.
Goal: order food and ask for directions on a trip to Tokyo in March."""

# Fixed ids, so the demo script can resume them: python -m sensai --session demo-food
[[sessions]]
id = "demo-food"
title = "Ordering food"
messages = [
    { role = "user", content = "How do I ask for the menu in a restaurant?" },
    { role = "assistant", content = "メニューをください (menyuu o kudasai) - the menu, please." },
    { role = "user", content = "And how do I say I want ramen?" },
    { role = "assistant", content = "ラーメンをください (raamen o kudasai) - ramen, please." },
]

[[sessions]]
id = "demo-particles"
title = "Particles"
messages = [
    { role = "user", content = "Is it 'watashi wa eiga ni mimasu'?" },
    { role = "assistant", content = "Almost: 見る takes を for what you watch. 私は映画を見ます (watashi wa eiga o mimasu) - I watch movies." },
]

# A longer lesson, so that compression (M2) has something to fold in the feature video.
[[sessions]]
id = "demo-lesson"
title = "A lesson on particles"
messages = [
    { role = "user", content = "What does the particle は do?" },
    { role = "assistant", content = "は (wa) marks the topic: what the sentence is about. 私は学生です (watashi wa gakusei desu) - I am a student. Written は, it is read wa when it is a particle." },
    { role = "user", content = "And が?" },
    { role = "assistant", content = "が (ga) marks the subject, often new information or the answer to a question. 誰が来ましたか (dare ga kimashita ka) - who came? 田中さんが来ました (Tanaka-san ga kimashita) - Tanaka came." },
    { role = "user", content = "When do I use を?" },
    { role = "assistant", content = "を (o) marks the direct object, the thing an action is done to. 水を飲みます (mizu o nomimasu) - I drink water. 本を読みます (hon o yomimasu) - I read a book." },
    { role = "user", content = "What about に?" },
    { role = "assistant", content = "に (ni) marks a destination, a point in time or where something exists. 学校に行きます (gakkou ni ikimasu) - I go to school. 七時に起きます (shichi-ji ni okimasu) - I get up at seven." },
    { role = "user", content = "And で?" },
    { role = "assistant", content = "で (de) marks where an action happens, or the means used. 図書館で勉強します (toshokan de benkyou shimasu) - I study at the library. バスで行きます (basu de ikimasu) - I go by bus." },
    { role = "user", content = "Can you give me one sentence with all of them?" },
    { role = "assistant", content = "私は毎朝七時に駅でコーヒーを飲みます (watashi wa maiasa shichi-ji ni eki de koohii o nomimasu) - every morning at seven I drink coffee at the station. は topic, に time, で place, を object." },
]

# Flashcards for the curriculum agent; due_in_days 0 means due on the day of the demo.
[[cards]]
front = "メニュー"
back = "menu (menyuu)"
due_in_days = 0

[[cards]]
front = "ください"
back = "please give me (kudasai)"
due_in_days = 0

[[cards]]
front = "ラーメン"
back = "ramen (raamen)"
due_in_days = 3

[[errors]]
sentence = "watashi wa eiga ni mimasu"
correction = "私は映画を見ます (watashi wa eiga o mimasu)"
error_type = "particle"

[[facts]]
key = "trip"
value = "Tokyo in March"

[[facts]]
key = "favourite food"
value = "ramen"
