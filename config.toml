# Sensai configuration. Overrides the built-in defaults in sensai/core/config.py.

[ollama]
url = "http://localhost:11434"
timeout_s = 60
model = "qwen3.5:4b"         # final choice comes from the layer 2 bake-off
num_ctx = 8192               # always explicit: never rely on Ollama's default
temperature = 0.3
think = false

[chat]
system_prompt = "You are Sensai, a patient Japanese teacher. Answer in the learner's language and give examples in Japanese."

[storage]
db_path = "data/sensai.db"

[memory]
max_history_turns = 20

[guardrails]
enabled = true

[logging]
level = "INFO"
path = "logs/sensai.jsonl"
