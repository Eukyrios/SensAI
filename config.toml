# Sensai configuration. Overrides the built-in defaults in sensai/core/config.py.
# Model and num_ctx are set per agent in agents/<name>.toml, never here.

[ollama]
url = "http://localhost:11434"
timeout_s = 60

[agents]
dir = "agents"
default = "sensei"
model_override = ""          # set by --model; empty = use each agent's own model

[storage]
db_path = "data/sensai.db"

[memory]
max_history_turns = 20

[guardrails]
enabled = true

[logging]
level = "INFO"
path = "logs/sensai.jsonl"
